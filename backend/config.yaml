# Homelab GPU Orchestrator Configuration

dashboard:
  host: "0.0.0.0"
  port: 4010

# GPU Pool
gpu_pool:
  total_gpus: 4
  gpu_ids: [2, 3, 4, 5]

# Service Definitions
services:
  llm:
    display_name: "LLM (vLLM)"
    description: "Large Language Model inference via vLLM"
    icon: "brain"
    gpu_requirement:
      min_gpus: 4
      max_gpus: 4
      exclusive: true
    launch:
      type: docker
      image: "vllm/vllm-openai:latest"
      container_name: "orchestrator-llm"
      working_dir: "/raid/home/june/workspace/language-insight-api"
      models_dir: "/raid/home/june/workspace/language-insight-api/models"
      model_preset: "gpt-oss-120b"
      port: 8000
      env:
        VLLM_ATTENTION_BACKEND: "TRITON_ATTN"
        NCCL_P2P_DISABLE: "1"
        NCCL_IB_DISABLE: "1"
      extra_args: "--trust-remote-code --gpu-memory-utilization 0.90 --max-model-len 32768"
    health_check:
      endpoint: "/health"
      interval_sec: 5
      timeout_sec: 3
      startup_timeout_sec: 600
    idle_timeout_sec: 300
    api:
      base_path: "/v1"
      proxy_endpoints:
        - "/v1/chat/completions"
        - "/v1/models"

  image:
    display_name: "Image Generation (Qwen-Image)"
    description: "Text-to-image generation via Qwen-Image"
    icon: "image"
    gpu_requirement:
      min_gpus: 1
      max_gpus: 4
      exclusive: false
    launch:
      type: process
      working_dir: "/raid/home/june/workspace/self-hosted-image-api"
      command: [".venv/bin/python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0"]
      port: 8001
      env:
        MODEL_ID: "Qwen/Qwen-Image-2512"
        TORCH_DTYPE: "bfloat16"
        GPU_MEMORY_FRACTION: "0.92"
        LOCAL_FILES_ONLY: "1"
        SAVE_OUTPUTS: "1"
        OUTPUT_DIR: "outputs"
        HF_HOME: "/home/june/.cache/huggingface"
        HF_HUB_CACHE: "/home/june/.cache/huggingface"
    health_check:
      endpoint: "/health"
      interval_sec: 5
      timeout_sec: 3
      startup_timeout_sec: 300
    idle_timeout_sec: 180
    api:
      base_path: ""
      proxy_endpoints:
        - "/generate"

  voice_stt:
    display_name: "Voice STT (Voxtral)"
    description: "Speech-to-text via Voxtral Mini"
    icon: "mic"
    gpu_requirement:
      min_gpus: 1
      max_gpus: 1
      exclusive: false
    launch:
      type: process
      working_dir: "/raid/home/june/workspace/self-hosted-voice-api"
      command: [".venv-stt/bin/vllm", "serve", "mistralai/Voxtral-Mini-4B-Realtime-2602"]
      port: 8002
      env:
        VLLM_DISABLE_COMPILE_CACHE: "1"
      extra_args: "--gpu-memory-utilization 0.85 --max-model-len 8192"
    health_check:
      endpoint: "/health"
      interval_sec: 5
      timeout_sec: 3
      startup_timeout_sec: 300
    idle_timeout_sec: 120
    api:
      base_path: "/v1"
      proxy_endpoints:
        - "/v1/chat/completions"

  voice_tts:
    display_name: "Voice TTS (Qwen3-TTS)"
    description: "Text-to-speech via Qwen3-TTS"
    icon: "volume-2"
    gpu_requirement:
      min_gpus: 1
      max_gpus: 1
      exclusive: false
    launch:
      type: process
      working_dir: "/raid/home/june/workspace/self-hosted-voice-api"
      command: [".venv-tts/bin/python", "-m", "uvicorn", "tts_server:app", "--host", "0.0.0.0"]
      port: 8003
      env:
        MODEL_ID: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
    health_check:
      endpoint: "/health"
      interval_sec: 5
      timeout_sec: 3
      startup_timeout_sec: 180
    idle_timeout_sec: 120
    api:
      base_path: ""
      proxy_endpoints:
        - "/synthesize"
        - "/clone"

# Queue Settings
queue:
  max_size: 100
  request_timeout_sec: 1800

# Polling settings (for backward compatibility)
polling:
  health_interval_seconds: 10
  status_interval_seconds: 5

# WebSocket settings
websocket:
  heartbeat_interval_seconds: 30
